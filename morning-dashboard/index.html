<!DOCTYPE html>
<html lang="en">
<head>

<title>Morning Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
/* ============================================================
   SETTINGS — edit these
   ============================================================ */
const CONFIG = {
  leaveTime: '07:58',
  clock24: false,

  // Weather location (Lea, Gainsborough)
  place: 'Lea, Gainsborough',
  lat: 53.3728,
  lon: -0.7536,

  // Timetable cycle. Set this to any Monday that was Week A.
  cycleStart: '2026-11-02',
  schoolEnds: '15:30',
  // Lessons: [start, end, subject, room]. One entry per weekday, Mon–Fri.
  weeks: {
    A: [
      [['09:10','10:00','Graphics','Rm 35'], ['10:00','10:50','Literature','Rm 83'], ['11:10','12:00','Chemistry','Rm 40'], ['12:00','12:50','Business','Rm 38'], ['13:50','14:40','Maths','Rm 75'], ['14:40','15:30','German','Rm 25']],
      [['09:10','10:00','German','Rm 25'], ['10:00','10:50','Literature','Rm 83'], ['11:10','12:00','Chemistry','Rm 40'], ['12:00','12:50','Maths','Rm 75'], ['13:50','14:40','Geography','Rm 23'], ['14:40','15:30','Geography','Rm 23']],
      [['09:10','10:00','Physics','Rm 31'], ['10:00','10:50','Literature','Rm 83'], ['11:10','12:00','PE','Hall'], ['12:00','12:50','Biology','Rm 03'], ['13:50','14:40','Citizenship','Rm 81'], ['14:40','15:30','Business','Rm 38']],
      [['09:10','10:00','English','Rm 83'], ['10:00','10:50','Physics','Rm 31'], ['11:10','12:00','Business','Rm 38'], ['12:00','12:50','Maths','Rm 75'], ['13:50','14:40','German','Rm 25'], ['14:40','15:30','PE','Hall']],
      [['09:10','10:00','Biology','Rm 03'], ['10:00','10:50','English','Rm 83'], ['11:10','12:00','Graphics','Rm 35'], ['12:00','12:50','Graphics','Rm 35'], ['13:50','14:40','Geography','Rm 23'], ['14:40','15:30','Maths','Rm 75']]
    ],
    B: [
      [['09:10','10:00','Physics','Rm 64'], ['10:00','10:50','German','Rm 25'], ['11:10','12:00','Literature','Rm 83'], ['12:00','12:50','PE','Hall'], ['13:50','14:40','Business','Rm 38'], ['14:40','15:30','Maths','Rm 75']],
      [['09:10','10:00','German','Rm 25'], ['10:00','10:50','Chemistry','Rm 40'], ['11:10','12:00','Maths','Rm 75'], ['12:00','12:50','Biology','Rm 03'], ['13:50','14:40','Graphics','Rm 35'], ['14:40','15:30','Graphics','Rm 35']],
      [['09:10','10:00','Business','Rm 38'], ['10:00','10:50','Citizenship','Rm 81'], ['11:10','12:00','Geography','Rm 04'], ['12:00','12:50','Geography','Rm 04'], ['13:50','14:40','English','Rm 83'], ['14:40','15:30','Biology','Rm 03']],
      [['09:10','10:00','German','Rm 25'], ['10:00','10:50','Business','Rm 38'], ['11:10','12:00','Chemistry','Rm 40'], ['12:00','12:50','Physics','Rm 64'], ['13:50','14:40','Maths','Rm 75'], ['14:40','15:30','Literature','Rm 83']],
      [['09:10','10:00','Graphics','Rm 35'], ['10:00','10:50','Maths','Rm 75'], ['11:10','12:00','English','Rm 83'], ['12:00','12:50','Geography','Rm 23'], ['13:50','14:40','Maths','Rm 75'], ['14:40','15:30','PE','Hall']]
    ]
  },

  // Before this time the countdown card counts to breakfast instead of leaving
  downstairsTime: '07:00',
  morningStart: '05:00',

  // Spotify "Now Playing". Paste the Client ID from developer.spotify.com,
  // then open the dashboard once with ?spotify on the end to log in.
  spotifyClientId: '',

  // Background animation. Lower fps = easier on a Fire TV Stick.
  motion: 1,
  glow: 0.2,
  fps: 24
};
</script>
<style>
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; }
  #stage-wrap { position: fixed; inset: 0; background: #050505; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage {
    position: relative; width: 1920px; height: 1080px; flex: none; transform-origin: center center; overflow: hidden;
    background: #050505; font-family: -apple-system, 'SF Pro Display', 'Figtree', sans-serif; color: #f4f4f2;

    background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.025));

    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 40px 100px rgba(0,0,0,0.45);
  }
  .label { font-size: 26px; font-weight: 600; color: rgba(255,255,255,0.55); }
  .muted { color: rgba(255,255,255,0.45); }

  .date { font-size: 38px; font-weight: 500; color: rgba(255,255,255,0.5); letter-spacing: -0.01em; }
  .time { font-size: 300px; font-weight: 500; line-height: 0.84; letter-spacing: -0.06em; color: #f6f6f4; }
  .suffix { font-size: 60px; font-weight: 500; color: rgba(255,255,255,0.35); letter-spacing: -0.02em; }

  .leave { height: 296px; padding: 40px 44px; display: grid; grid-template-columns: minmax(0,1fr) 184px; align-items: center; gap: 32px;
    background: linear-gradient(155deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 40px 100px rgba(0,0,0,0.5); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .leave-num { font-size: 120px; font-weight: 500; line-height: 1; letter-spacing: -0.05em; }
  .leave-unit { font-size: 38px; font-weight: 500; color: rgba(255,255,255,0.55); }

  .lesson { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 18px; height: 52px; padding: 0 16px; border-radius: 18px; }
  .lesson .start { font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.45); }
  .lesson .subject { font-size: 30px; letter-spacing: -0.01em; }
  .lesson .tag { font-size: 22px; font-weight: 600; }
  .no-school { font-size: 34px; font-weight: 500; color: rgba(255,255,255,0.5); padding: 24px 16px; }

  .hour { display: flex; flex-direction: column; align-items: center; gap: 8px; }

  @keyframes eqb { 0%,100% { transform: scaleY(0.25) } 50% { transform: scaleY(1) } }
  @keyframes artspin { to { transform: rotate(360deg) } }
  @keyframes artglow { 0%,100% { transform: scale(1); opacity: 0.55 } 50% { transform: scale(1.12); opacity: 0.85 } }
  .eq { display: flex; align-items: flex-end; gap: 5px; height: 28px; }
  .eq div { width: 5px; height: 28px; border-radius: 3px; background: #f4f4f2; transform-origin: bottom; animation: eqb 1s ease-in-out infinite; }
  .eq.paused div { animation-play-state: paused; transform: scaleY(0.25); opacity: 0.4; }
  .art { position: relative; width: 168px; height: 168px; border-radius: 28px; overflow: hidden; background: #161616;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.1); }
  .art .spin { position: absolute; inset: -40%; background: conic-gradient(from 0deg, #2a2a2a, #6a6a6a, #1b1b1b, #9a9a9a, #2a2a2a);
    animation: artspin 18s linear infinite; filter: blur(18px); }
  .art .glow { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.7), rgba(255,255,255,0) 70%); animation: artglow 3.2s ease-in-out infinite; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .art.has-img img { display: block; }
  .art.has-img .spin, .art.has-img .glow { display: none; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>

<body>
<div id="stage-wrap">
  <div id="stage">

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const toMin = s => +s.slice(0, 2) * 60 + +s.slice(3, 5);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- Fit 1920x1080 stage to any screen ----------
function fit() {
  const w = window.innerWidth, h = window.innerHeight;
  if (w > 0 && h > 0) $('stage').style.transform = `scale(${Math.min(w / 1920, h / 1080)})`;
}
window.addEventListener('resize', fit);
fit();

// ---------- Animated background ----------
const blobs = [
  { c: [150, 150, 150], x: 0.2, y: 0.25, r: 0.5, sx: 0.00009, sy: 0.00006, p: 0 },
  { c: [110, 110, 115], x: 0.85, y: 0.2, r: 0.45, sx: 0.00007, sy: 0.0001, p: 2 },
  { c: [120, 118, 114], x: 0.55, y: 0.95, r: 0.55, sx: 0.00005, sy: 0.00008, p: 4 },
  { c: [160, 110, 70], x: 0.05, y: 0.9, r: 0.35, sx: 0.00008, sy: 0.00005, p: 1 }
];
const ctx = $('bg').getContext('2d');
let lastFrame = 0;
function draw(t) {
  requestAnimationFrame(draw);
  if (t - lastFrame < 1000 / CONFIG.fps) return;
  lastFrame = t;
  const W = 384, H = 216, k = CONFIG.motion, a = CONFIG.glow;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs) {
    const x = (b.x + Math.sin(t * b.sx * k + b.p) * 0.2) * W;
    const y = (b.y + Math.cos(t * b.sy * k + b.p) * 0.18) * H;
    const g = ctx.createRadialGradient(x, y, 0, x, y, b.r * W);
    g.addColorStop(0, `rgba(${b.c},${a})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
}
requestAnimationFrame(draw);

// ---------- Timetable cycle ----------
function weekLetter(day) {
  const start = new Date(CONFIG.cycleStart + 'T00:00:00');
  const weeks = Math.floor(Math.round((day - start) / 86400000) / 7);
  return ((weeks % 2) + 2) % 2 === 0 ? 'A' : 'B';
}
function lessonsFor(day) {
  const dow = day.getDay();
  if (dow === 0 || dow === 6) return null;
  return CONFIG.weeks[weekLetter(day)][dow - 1] || [];
}
// Today until the last lesson ends, otherwise the next school day.
function schoolDay(now) {
  const d = new Date(now); d.setHours(0, 0, 0, 0);
  const today = lessonsFor(d);
  const nowMin = now.getHours() * 60 + now.getMinutes();
  if (today && nowMin < toMin(CONFIG.schoolEnds)) return { day: d, lessons: today, isToday: true };
  for (let i = 1; i <= 7; i++) {
    const n = new Date(d); n.setDate(d.getDate() + i);
    const l = lessonsFor(n);
    if (l) return { day: n, lessons: l, isToday: false };
  }
}

// ---------- Clock, leave countdown, timetable ----------
let lastTimetableKey = '';
function tick() {
  const now = new Date();
  const h24 = CONFIG.clock24;
  $('time').textContent = `${h24 ? pad(now.getHours()) : (now.getHours() % 12 || 12)}:${pad(now.getMinutes())}`;
  $('suffix').textContent = h24 ? '' : (now.getHours() < 12 ? 'AM' : 'PM');
  $('date').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

  const sd = schoolDay(now);

  // Countdown: to breakfast during the early morning on a school day, otherwise to leaving
  const nowM = now.getHours() * 60 + now.getMinutes();
  const breakfast = sd.isToday && nowM >= toMin(CONFIG.morningStart) && nowM < toMin(CONFIG.downstairsTime);
  const target = breakfast ? CONFIG.downstairsTime : CONFIG.leaveTime;
  $('leave-label').textContent = breakfast ? 'Downstairs for breakfast' : 'Leave for school';
  const leave = new Date(sd.day); leave.setHours(+target.slice(0, 2), +target.slice(3, 5), 0, 0);
  if (leave < now) leave.setDate(leave.getDate() + 1);
  const diff = Math.ceil((leave - now) / 60000);
  let num, unit;
  if (diff < 60) { num = diff; unit = 'min'; }
  else if (diff < 1440) { num = Math.floor(diff / 60); unit = `h ${diff % 60}m`; }
  else { num = Math.floor(diff / 1440); unit = `d ${Math.floor((diff % 1440) / 60)}h`; }
  const tint = diff <= 5 ? '#ff5f4a' : diff <= 15 ? '#ffa44d' : '#f4f4f2';
  $('leave-num').textContent = num;
  $('leave-num').style.color = diff <= 5 ? '#ff5f4a' : '#f6f6f4';
  $('leave-unit').textContent = unit;
  $('leave-dot').style.background = tint;
  $('ring').setAttribute('stroke', tint);
  $('ring').setAttribute('stroke-dashoffset', 502.65 * (1 - Math.min(1, diff / 60)));
  const lh = +target.slice(0, 2), lm = target.slice(3, 5);
  const leaveLabel = h24 ? target : `${lh % 12 || 12}:${lm}`;
  $('ring-time').textContent = leaveLabel;
  $('ring-ampm').textContent = h24 ? '' : (lh < 12 ? 'AM' : 'PM');
  const leaveH = +CONFIG.leaveTime.slice(0, 2);
  const leaveAt = (h24 ? CONFIG.leaveTime : `${leaveH % 12 || 12}:${CONFIG.leaveTime.slice(3, 5)}`) + (h24 ? '' : (leaveH < 12 ? 'am' : 'pm'));
  $('leave-at').textContent = breakfast
    ? `Then leave at ${leaveAt}`
    : sd.isToday || sd.day - new Date(now).setHours(0, 0, 0, 0) <= 86400000
    ? `Leave at ${leaveAt}`
    : `Next: ${sd.day.toLocaleDateString('en-GB', { weekday: 'long' })}`;

  // Timetable (only re-render when the minute changes)
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const key = sd.day.toDateString() + nowMin;
  if (key === lastTimetableKey) return;
  lastTimetableKey = key;

  const dayName = sd.day.toLocaleDateString('en-GB', { weekday: 'long' });
  $('tt-day').textContent = `${sd.isToday ? dayName : (sd.day - new Date(now).setHours(0,0,0,0) === 86400000 ? 'Tomorrow' : dayName)} · Week ${weekLetter(sd.day)}`;

  const L = sd.lessons;
  let cur = -1, next = 0;
  if (sd.isToday) {
    cur = L.findIndex(l => nowMin >= toMin(l[0]) && nowMin < toMin(l[1]));
    next = cur === -1 ? L.findIndex(l => nowMin < toMin(l[0])) : -1;
  }
  if (!L.length) {
    $('lessons').innerHTML = `<div class="no-school">Week ${weekLetter(sd.day)} timetable not added yet</div>`;
    return;
  }
  $('lessons').innerHTML = L.map((l, i) => {
    const on = i === cur, nx = i === next, hi = on || nx;
    const past = sd.isToday && (cur !== -1 ? i < cur : next > 0 && i < next);
    return `<div class="lesson" style="background:${hi ? 'rgba(255,255,255,0.09)' : 'transparent'};opacity:${past ? 0.35 : 1}">
      <div class="start">${esc(l[0])}</div>
      <div class="subject" style="font-weight:${hi ? 600 : 400}">${esc(l[2])}</div>
      <div class="tag" style="color:${hi ? '#f4f4f2' : 'rgba(255,255,255,0.35)'}">${on ? 'Now' : nx ? 'Next' : esc(l[3])}</div>
    </div>`;
  }).join('');
}
tick();
setInterval(tick, 1000);

// ---------- Spotify Now Playing (PKCE login, no server) ----------
const SP_REDIRECT = location.origin + location.pathname;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function spLogin() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  store.set('sp_verifier', verifier);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: CONFIG.spotifyClientId, response_type: 'code', redirect_uri: SP_REDIRECT,
    scope: 'user-read-playback-state user-read-currently-playing',
    code_challenge_method: 'S256', code_challenge: challenge
  });
}
async function spToken(params) {
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CONFIG.spotifyClientId, ...params })
  });
  const t = await res.json();
  if (!res.ok) throw new Error(t.error || res.status);
  store.set('sp_access', t.access_token);
  store.set('sp_expires', Date.now() + (t.expires_in - 60) * 1000);
  if (t.refresh_token) store.set('sp_refresh', t.refresh_token);
}
async function spAccess() {
  if (store.get('sp_access') && Date.now() < +store.get('sp_expires')) return store.get('sp_access');
  const refresh = store.get('sp_refresh');
  if (!refresh) return null;
  await spToken({ grant_type: 'refresh_token', refresh_token: refresh });
  return store.get('sp_access');
}

let np = null; // { title, artist, device, img, progress, duration, playing, at }
function renderNP(msg) {
  const on = np && np.playing;
  $('eq').classList.toggle('paused', !on);
  $('np-title').textContent = np ? np.title : msg;
  $('np-artist').textContent = np ? np.artist : 'Spotify';
  $('np-device').textContent = np ? np.device : '';
  if (np && np.img) { if ($('art-img').src !== np.img) $('art-img').src = np.img; $('art').classList.add('has-img'); }
  else $('art').classList.remove('has-img');
  updateBar();
}
function updateBar() {
  const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
  if (!np || !np.duration) { $('np-bar').style.width = '0'; $('np-elapsed').textContent = '0:00'; $('np-remaining').textContent = '-0:00'; return; }
  const p = Math.min(np.duration, np.progress + (np.playing ? Date.now() - np.at : 0));
  $('np-bar').style.width = (p / np.duration * 100) + '%';
  $('np-elapsed').textContent = fmt(p);
  $('np-remaining').textContent = '-' + fmt(np.duration - p);
}
async function loadSpotify() {
  if (!CONFIG.spotifyClientId) return renderNP('Not connected');
  try {
    const token = await spAccess();
    if (!token) return renderNP('Not connected');
    const res = await fetch('https://api.spotify.com/v1/me/player?additional_types=episode', { headers: { Authorization: 'Bearer ' + token } });
    if (res.status === 401) { store.set('sp_expires', 0); return; }
    if (res.status === 204) { np = null; return renderNP('Nothing playing'); }
    if (!res.ok) throw new Error(res.status);
    const p = await res.json();
    const it = p.item;
    if (!it) { np = null; return renderNP('Nothing playing'); }
    const imgs = (it.album || it.show || {}).images || [];
    np = {
      title: it.name,
      artist: it.artists ? it.artists.map(a => a.name).join(', ') : (it.show ? it.show.name : ''),
      device: p.device ? p.device.name : '',
      img: (imgs[1] || imgs[0] || {}).url || '',
      progress: p.progress_ms || 0, duration: it.duration_ms || 0, playing: p.is_playing, at: Date.now()
    };
    renderNP();
  } catch (e) {
    // Leave whatever is showing; try again next poll
  }
}

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has('spotify') && CONFIG.spotifyClientId) return spLogin();
  if (q.has('code') && store.get('sp_verifier')) {
    try {
      await spToken({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: SP_REDIRECT, code_verifier: store.get('sp_verifier') });
    } catch (e) {}
    store.set('sp_verifier', null);
    history.replaceState(null, '', SP_REDIRECT);
  }
  loadSpotify();
  setInterval(loadSpotify, 5000);
  setInterval(updateBar, 1000);
})();

// ---------- Weather (Open-Meteo, no key) ----------
$('place').textContent = CONFIG.place;
const WMO = {
  0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Freezing fog',
  51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle',
  61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain',
  71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains',
  80: 'Light showers', 81: 'Showers', 82: 'Heavy showers', 85: 'Snow showers', 86: 'Snow showers',
  95: 'Thunderstorms', 96: 'Thunderstorms', 99: 'Thunderstorms'
};
async function loadWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
      `&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability` +
      `&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FLondon&forecast_days=2`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const w = await res.json();
    $('w-temp').textContent = `${Math.round(w.current.temperature_2m)}°`;
    $('w-desc').textContent = WMO[w.current.weather_code] || '';
    $('w-hilo').textContent = `H ${Math.round(w.daily.temperature_2m_max[0])}°  L ${Math.round(w.daily.temperature_2m_min[0])}°`;

    // Next four 3-hourly slots from the coming hour
    const now = new Date();
    const startIdx = w.hourly.time.findIndex(t => new Date(t) > now);
    const slots = [0, 3, 6, 9].map(o => startIdx + o).filter(i => i >= 0 && i < w.hourly.time.length);
    $('hourly').innerHTML = slots.map(i => {
      const hr = new Date(w.hourly.time[i]).getHours();
      const label = CONFIG.clock24 ? pad(hr) + ':00' : `${hr % 12 || 12}${hr < 12 ? 'AM' : 'PM'}`;
      return `<div class="hour">
        <div style="font-size:22px;font-weight:500;color:rgba(255,255,255,0.4)">${label}</div>
        <div style="font-size:34px;font-weight:500">${Math.round(w.hourly.temperature_2m[i])}°</div>
        <div style="font-size:21px;font-weight:500;color:rgba(255,255,255,0.4)">${w.hourly.precipitation_probability[i] ?? 0}%</div>
      </div>`;
    }).join('');
  } catch (e) {
    // Keep the last good reading if there is one
    if ($('w-temp').textContent === '–') $('w-desc').textContent = 'Weather unavailable';
  }
}
loadWeather();
setInterval(loadWeather, 20 * 60 * 1000);

// Reload once a day at 3am so the page never goes stale
setInterval(() => { const n = new Date(); if (n.getHours() === 3 && n.getMinutes() === 0) location.reload(); }, 60000);
</script>
